<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
// Redirect to index.html with the path preserved
var path = window.location.pathname;
var sections = ['citizenship','residences','visas','quote','expertise','contacts','get-consultation'];
var segment = path.replace(/^\//,'').replace(/\/$/,'');
if (sections.indexOf(segment) !== -1) {
  window.location.replace('/' + '?p=' + segment);
} else {
  window.location.replace('/');
}
</script>
</head>
<body></body>
</html>
